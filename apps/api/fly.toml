# API de staging en Fly.io (ADR-11, SBA-7). La despliega
# .github/workflows/despliegue.yml desde la raíz del repositorio:
#
#   flyctl deploy . --config apps/api/fly.toml --dockerfile apps/api/Dockerfile
#
# Los secretos (API_DATABASE_URL, AUTH0_*, CORS_ORIGINS, WEB_URL, SMTP_URL) se
# cargan con `flyctl secrets set`, nunca aquí. La URL del dueño de las tablas no
# entra a Fly.io: el workflow corre las migraciones antes de desplegar.

app = "sigba-api-staging"
primary_region = "iad"

[http_service]
  internal_port = 3000
  force_https = true
  # Una máquina siempre encendida: la PWA pide /health en menos de 1 s (SBA-7)
  # y un arranque en frío de Nest no cabe en ese margen.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/v1/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
