name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un PR que recibe otro push cancela la corrida anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Sin credenciales de producción en el pipeline (Arquitectura 7.2).
  NODE_ENV: test

jobs:
  rama:
    name: rama
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      RAMA: ${{ github.head_ref }}
    steps:
      # GitHub no ofrece branch_name_pattern en repositorios de cuenta personal:
      # las reglas de patrón son solo para repos de organización. Comprobarlo
      # aquí bloquea el merge igual. Ver .github/rulesets/README.md.
      - name: El nombre de la rama sigue el formato de Linear
        run: |
          if [[ ! "$RAMA" =~ ^sba-[0-9]+-[a-z0-9-]+$ ]]; then
            echo "::error::La rama \"$RAMA\" no sigue el formato."
            echo ""
            echo "  Se espera:  sba-<numero>-<titulo-en-minusculas>"
            echo "  Por ejemplo: sba-24-recepcion-manual-con-red"
            echo ""
            echo "  Usa el boton \"Copy git branch name\" del ticket en Linear."
            echo "  Para renombrar una rama que ya existe:"
            echo "    git branch -m sba-<numero>-<titulo>"
            echo "    git push origin -u sba-<numero>-<titulo>"
            echo "    git push origin --delete \"$RAMA\""
            exit 1
          fi
          echo "Rama \"$RAMA\": correcta."

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - name: formato
        run: pnpm run format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest

    # RNF-01 pide la prueba de aislamiento «en el pipeline, con cero filas de
    # otro banco». Eso solo lo demuestra Postgres: una simulación de las
    # políticas en JavaScript seguiría verde con un USING (true).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sigba
          POSTGRES_PASSWORD: sigba
          POSTGRES_DB: sigba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sigba -d sigba"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Datos sintéticos y base efímera: nunca una copia de producción
      # (Arquitectura 7.1).
      DATABASE_URL: postgresql://sigba:sigba@localhost:5432/sigba

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: migraciones
        run: pnpm --filter @sigba/api exec prisma migrate deploy
      - run: pnpm run test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
