packages:
  - 'apps/*'
  - 'packages/*'

# Un solo lugar donde se fijan las versiones compartidas.
# «Fijar versiones compatibles en el lockfile de la Iteración 0» (Arquitectura 5.1).
# Los paquetes las referencian con "catalog:" en vez de repetir el número.
catalog:
  # Lenguaje y tipos
  typescript: 6.0.3
  '@types/node': ^24.13.5

  # Lint y formato
  eslint: ^10.10.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.70.0
  eslint-config-prettier: ^10.1.8
  globals: ^17.12.0
  prettier: ^3.9.7

  # Pruebas
  vitest: ^4.1.11
  '@vitest/coverage-v8': ^4.1.11
